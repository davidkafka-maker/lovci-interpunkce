<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Lovci interpunkce</title><style>
:root{--gold:#fbbf24;--green:#22c55e;--red:#ef4444;--cyan:#38bdf8;--muted:#cbd5e1;--card:rgba(15,23,42,.93)}
*{box-sizing:border-box} body{margin:0;min-height:100vh;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 18% 0%,rgba(251,191,36,.26),transparent 28%),radial-gradient(circle at 88% 8%,rgba(56,189,248,.20),transparent 25%),linear-gradient(135deg,#111827,#0f172a 55%,#1e1b4b)}
.wrap{width:min(1000px,100%);margin:0 auto;padding:9px}.screen{display:none!important}.screen.active{display:block!important}.hero.active{min-height:100vh;display:flex!important;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
h1{font-size:clamp(36px,8vw,74px);margin:0;text-align:center;text-shadow:0 5px 24px rgba(251,191,36,.25)}.subtitle{font-size:clamp(15px,3.2vw,21px);color:var(--muted);max-width:780px;line-height:1.35}
.menuGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(760px,100%);margin-top:8px}button{border:0;border-radius:18px;padding:12px 14px;color:white;font-weight:1000;cursor:pointer;font-size:clamp(16px,3.6vw,22px);background:linear-gradient(180deg,#334155,#111827);box-shadow:0 10px 26px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.14)}button:active{transform:scale(.98)}
.primary{background:linear-gradient(180deg,#f59e0b,#92400e)}.cyan{background:linear-gradient(180deg,#0891b2,#155e75)}.redbtn{background:linear-gradient(180deg,#dc2626,#7f1d1d)}.greenbtn{background:linear-gradient(180deg,#16a34a,#14532d)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;background:rgba(2,6,23,.5);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:7px;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 10px;font-weight:900;font-size:14px}.card{background:var(--card);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.38)}
.sentence{font-size:clamp(18px,4.1vw,30px);line-height:1.30;font-weight:850;margin:4px 0 10px;background:rgba(255,255,255,.07);border-radius:18px;padding:12px;border-left:5px solid var(--gold)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{display:flex;align-items:center;gap:8px;padding:10px;border-radius:15px;background:rgba(255,255,255,.08);border:2px solid transparent;cursor:pointer;font-weight:900;font-size:clamp(13px,2.8vw,17px);min-height:56px}.choice.selected{border-color:var(--gold);background:rgba(251,191,36,.14)}.choice input{transform:scale(1.15);flex:0 0 auto}
.answerRow{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:9px;align-items:center}input[type=text]{width:100%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:white;border-radius:15px;padding:12px;font-size:19px;outline:none;font-weight:850}input[type=text]:focus{border-color:var(--cyan)}
.feedback{display:none;margin-top:8px;border-radius:16px;padding:10px;font-weight:1000;font-size:clamp(18px,4.2vw,30px)}.feedback.ok{display:block;background:rgba(34,197,94,.18);border:3px solid var(--green);color:#bbf7d0}.feedback.bad{display:block;background:rgba(239,68,68,.18);border:3px solid var(--red);color:#fecaca}.fieldBad{border-color:var(--red)!important;background:rgba(239,68,68,.25)!important}.fieldOk{border-color:var(--green)!important;background:rgba(34,197,94,.18)!important}.hidden{display:none!important}.resultBox{text-align:center;padding:22px}.grade{font-size:clamp(70px,22vw,145px);font-weight:1000;color:var(--gold);margin:8px 0;text-shadow:0 0 25px rgba(251,191,36,.28)}.small{font-size:15px;color:var(--muted);font-weight:700}
@media(max-width:760px){.wrap{padding:7px}.menuGrid{grid-template-columns:1fr}.top{flex-wrap:wrap}.choices{grid-template-columns:1fr}.answerRow{grid-template-columns:1fr 1fr}#wordInput{grid-column:1/-1}.sentence{font-size:20px;line-height:1.28;padding:10px}.card{padding:9px}button{padding:11px 10px}}
</style></head><body>
<div class="wrap">
<section id="menu" class="screen active hero">
<h1>Lovci interpunkce</h1>
<div class="subtitle">Rozhodni, zda je interpunkce v pořádku, zda čárka chybí, nebo zda je jedna čárka navíc. U opravy napiš slovo, za kterým se má čárka doplnit nebo ubrat.</div>
<div class="menuGrid">
<button class="primary" id="btnTrain">TRÉNINK</button><button class="cyan" id="btnChallenge">VÝZVA</button><button class="redbtn" id="btnTest">TEST</button>
</div><div class="small">VÝZVA: 16 správně za sebou = jednička. TEST: 20 otázek a známka 1–5.</div>
</section>
<section id="game" class="screen">
<div class="top"><div class="pill" id="modeLabel">TRÉNINK</div><div class="pill" id="progressLabel">0 / 0</div><div class="pill" id="scoreLabel">Správně: 0</div><button style="font-size:14px;padding:7px 10px;border-radius:12px" id="btnMenu">MENU</button></div>
<div class="card"><div id="sentence" class="sentence"></div><div class="choices">
<label class="choice" data-type="OK"><input type="radio" name="type" value="OK"> Interpunkce je v pořádku</label>
<label class="choice" data-type="ADD"><input type="radio" name="type" value="ADD"> Čárka chybí za slovem…</label>
<label class="choice" data-type="REMOVE"><input type="radio" name="type" value="REMOVE"> Čárku ubrat za slovem…</label>
</div><div class="answerRow"><input id="wordInput" type="text" placeholder="Slovo pro opravu…" autocomplete="off"><button id="checkBtn" class="greenbtn">OVĚŘIT</button><button id="nextBtn" class="primary hidden">DÁLE</button></div><div id="feedback" class="feedback"></div></div>
</section>
<section id="result" class="screen"><div class="card resultBox"><h1 id="resultTitle">Hotovo!</h1><div id="resultMain" class="grade">1</div><div id="resultText" class="subtitle"></div><div class="menuGrid" style="grid-template-columns:1fr 1fr;margin:auto;margin-top:18px"><button class="primary" id="btnAgain">ZKUSIT ZNOVU</button><button id="btnMenu2">MENU</button></div></div></section>
</div>
<script>
const DB = [{"sentence": "Petře prosím až přijdeš domů, podívej se na dopis, který, jak víš, ležel na stole.", "type": "ADD", "word": "Petře"}, {"sentence": "Ředitel, zkušený organizátor oznámil, že pokud se přihlásí dostatek žáků, výlet se uskuteční.", "type": "ADD", "word": "organizátor"}, {"sentence": "Dům, starý a opuštěný stál na kopci, odkud bylo vidět na řeku, která se v dálce ztrácela.", "type": "ADD", "word": "opuštěný"}, {"sentence": "Když jsme, jak se později ukázalo, dorazili pozdě, učitel, zjevně rozladěný, zahájil hodinu bez nás.", "type": "OK", "word": ""}, {"sentence": "Marie, jak víš se na schůzku nedostavila, protože vlak, kterým měla přijet, měl zpoždění.", "type": "ADD", "word": "víš"}, {"sentence": "Ten obraz, údajně ztracený, visel v galerii, kde ho nikdo, jak se zdá, nepoznal.", "type": "OK", "word": ""}, {"sentence": "Pane učiteli, mohl byste nám vysvětlit úkol, který jsme včera, upřímně řečeno vůbec nepochopili?", "type": "ADD", "word": "řečeno"}, {"sentence": "Kniha, kterou napsal autor, známý svými detektivkami byla přijata s nadšením.", "type": "ADD", "word": "detektivkami"}, {"sentence": "Dívka, která, jak jsme si všimli, stála u okna, odešla, aniž by cokoli řekla.", "type": "OK", "word": ""}, {"sentence": "Petr si myslel, že nemá, jak vždycky sám říkává, domácí úkol a on ho pak našel v tašce.", "type": "ADD", "word": "úkol"}, {"sentence": "Pane kolego uznejte že návrh, který jste předložil, není, jak jste tvrdil, bezchybný.", "type": "ADD", "word": "kolego"}, {"sentence": "Muž, unavený a zamlklý seděl v koutě, odkud pozoroval hosty, kteří, jak se zdálo, o něm nevěděli.", "type": "ADD", "word": "zamlklý"}, {"sentence": "Když jsme dorazili, což nás samotné překvapilo, dřív než ostatní, čekal tam učitel, připravený a klidný.", "type": "OK", "word": ""}, {"sentence": "Prosím vás paní řekněte mi kde je kancelář, která byla ještě včera otevřená.", "type": "ADD", "word": "paní"}, {"sentence": "Student, který se jak se ukázalo připravoval svědomitě, uspěl i v části, kterou ostatní nezvládli.", "type": "ADD", "word": "ukázalo"}, {"sentence": "Auto, zaparkované před domem zmizelo přes noc, aniž by si toho někdo, jak tvrdili sousedé, všiml.", "type": "ADD", "word": "domem"}, {"sentence": "Ano, přiznal učitel, který se opřel o katedru, výklad nebyl, jak jsem původně plánoval, úplný.", "type": "OK", "word": ""}, {"sentence": "Dopis, starý a zažloutlý ležel v zásuvce, kde ho nikdo, jak se zdá, dlouho nehledal.", "type": "ADD", "word": "zažloutlý"}, {"sentence": "Když se ozvalo zaklepání, tiché ale naléhavé, otevřel dveře muž, který tam, jak jsme věděli, neměl být.", "type": "ADD", "word": "tiché"}, {"sentence": "Přiznávám se, řekl student, který se pousmál, úkol jsem nepochopil a raději jsem ho neodevzdal.", "type": "ADD", "word": "nepochopil"}, {"sentence": "Dům, který jsme, jak si jistě pamatuješ, navštívili loni, byl nyní prázdný, ačkoliv dříve, býval plný života.", "type": "REMOVE", "word": "dříve"}, {"sentence": "Chlapec, drobný a vystrašený stál u dveří, odkud sledoval rozhovor, který se ho, jak tušil, týkal.", "type": "ADD", "word": "vystrašený"}, {"sentence": "Pane řediteli domnívám se že rozhodnutí, které jste učinil, není, jak jste říkal, konečné.", "type": "ADD", "word": "řediteli"}, {"sentence": "Když jsme, aniž bychom si to uvědomili, překročili hranici, začal průvodce, zkušený a opatrný, jednat rychle.", "type": "OK", "word": ""}, {"sentence": "Zahrada, zarostlá a opuštěná působila dojmem, že ji nikdo, jak jsme se domnívali, dlouho nenavštívil.", "type": "ADD", "word": "opuštěná"}, {"sentence": "Petře, uznej že řešení, které jsi navrhl není, jak jsi tvrdil, jediné možné.", "type": "ADD", "word": "navrhl"}, {"sentence": "Město, kdysi slavné a bohaté dnes chátrá, ačkoliv radnice, jak víme, slibuje obnovu.", "type": "ADD", "word": "bohaté"}, {"sentence": "Když se dveře, staré a těžké, konečně otevřely, vstoupil muž, který tam, jak se ukázalo, měl důležitou roli.", "type": "REMOVE", "word": "těžké"}, {"sentence": "Prosím tě, kamaráde vysvětli mi proč úkol, který jsme měli odevzdat dnes, nikdo nepřinesl.", "type": "ADD", "word": "kamaráde"}, {"sentence": "Student, který, jak se později ukázalo podváděl, byl potrestán, a škola, přísná a důsledná, to oznámila rodičům.", "type": "ADD", "word": "ukázalo"}, {"sentence": "Dívka, zamyšlená a tichá seděla u stolu, odkud pozorovala hosty, kteří si jí, jak se zdálo, nevšímali.", "type": "ADD", "word": "tichá"}, {"sentence": "Ano přiznávám že rozhodnutí, které jsem učinil, nebylo, jak jsem doufal, správné.", "type": "ADD", "word": "Ano"}, {"sentence": "Když jsme přišli, což nás zaskočilo, dřív než ostatní, čekal tam učitel, klidný a připravený.", "type": "OK", "word": ""}, {"sentence": "Pane profesore, domnívám se, že text, který jsme četli není, jak jste tvrdil jednoduchý.", "type": "ADD", "word": "tvrdil"}, {"sentence": "Kniha, stará a poničená ležela na stole, odkud ji nikdo, jak jsme zjistili, neodnesl.", "type": "ADD", "word": "poničená"}, {"sentence": "Ale uznej že postup, který jsi zvolil, není, jak se zdá, správný a měl bys ho změnit.", "type": "ADD", "word": "správný"}, {"sentence": "Chlapec, který, jak jsme si všimli stál u okna, odešel, aniž by cokoli řekl.", "type": "ADD", "word": "všimli"}, {"sentence": "Prosím vás, pane, vysvětlete mi, proč odpověď, kterou jste uvedl, není, jak tvrdíte, chybná.", "type": "OK", "word": ""}, {"sentence": "Dům, opuštěný a tichý působil dojmem, že v něm nikdo, jak jsme si mysleli, dlouho nebydlel.", "type": "ADD", "word": "tichý"}, {"sentence": "Když se ozvalo zaklepání, tiché ale důrazné, otevřel dveře muž, který tam, jak jsme věděli, neměl být.", "type": "ADD", "word": "tiché"}, {"sentence": "Ano, přiznal že řešení, které navrhl, není, jak se ukázalo, správné.", "type": "ADD", "word": "přiznal"}, {"sentence": "Student, unavený ale spokojený odevzdal práci, kterou, jak tvrdil, připravoval několik dní.", "type": "ADD", "word": "spokojený"}, {"sentence": "Pane učiteli, domnívám se, že otázka, kterou jste položil není, jak jste řekl jednoduchá.", "type": "ADD", "word": "položil"}, {"sentence": "Když jsme dorazili, což nás překvapilo, později než ostatní, začal učitel, klidný a soustředěný, vysvětlovat látku.", "type": "OK", "word": ""}, {"sentence": "Dopis, starý a zapomenutý ležel na stole, odkud ho nikdo, jak se zdá, nevzal.", "type": "ADD", "word": "zapomenutý"}, {"sentence": "Ale přiznej že řešení, které jsi zvolil, není, jak jsi tvrdil, jediné možné.", "type": "ADD", "word": "přiznej"}, {"sentence": "Dívka, tichá a nenápadná stála u dveří, odkud sledovala rozhovor, který se jí, jak tušila, týkal.", "type": "ADD", "word": "nenápadná"}, {"sentence": "Prosím tě Petře, vysvětli mi proč úkol, který jsme měli odevzdat dnes, nikdo nepřinesl.", "type": "ADD", "word": "tě"}, {"sentence": "Když jsme, aniž bychom si to uvědomili překročili hranici, začal průvodce, zkušený a opatrný, jednat rychle.", "type": "ADD", "word": "uvědomili"}, {"sentence": "Muž, unavený a zamyšlený seděl v koutě, odkud sledoval hosty, kteří si ho, jak se zdálo, nevšímali.", "type": "ADD", "word": "zamyšlený"}];
let currentMode='train', deck=[], index=0, correct=0, streak=0, answered=false, autoTimer=null;
function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function norm(s){return (s||'').trim().toLowerCase().replace(/[.,;:!?„“"'’]/g,'');}
function show(id){clearTimeout(autoTimer);document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
function goMenu(){playTone(220,.08,'sine');show('menu');}
function startMode(m){currentMode=m;index=0;correct=0;streak=0;answered=false;deck=shuffle(DB);if(m==='test')deck=deck.slice(0,20);show('game');document.getElementById('modeLabel').textContent=m==='train'?'TRÉNINK':m==='challenge'?'VÝZVA':'TEST';renderQuestion();playTone(440,.08,'triangle');}
function renderQuestion(){clearTimeout(autoTimer);answered=false;if(currentMode==='test'&&index>=deck.length)return finishTest();if(currentMode==='challenge'&&streak>=16)return finishChallenge();if(index>=deck.length){deck=shuffle(DB);index=0;}let q=deck[index];document.getElementById('sentence').textContent=q.sentence;document.querySelectorAll('input[name=type]').forEach(r=>r.checked=false);document.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));let inp=document.getElementById('wordInput');inp.value='';inp.disabled=false;inp.className='';let fb=document.getElementById('feedback');fb.className='feedback';fb.textContent='';document.getElementById('nextBtn').classList.add('hidden');document.getElementById('checkBtn').classList.remove('hidden');updateLabels();}
function updateLabels(){document.getElementById('progressLabel').textContent=currentMode==='train'?`Otázka ${index+1}`:currentMode==='challenge'?`Série: ${streak} / 16`:`${Math.min(index+1,deck.length)} / ${deck.length}`;document.getElementById('scoreLabel').textContent=currentMode==='challenge'?`Správně v řadě: ${streak}`:`Správně: ${correct}`;}
document.querySelectorAll('.choice').forEach(l=>l.addEventListener('click',()=>{document.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));l.classList.add('selected');l.querySelector('input').checked=true;if(l.dataset.type!=='OK')setTimeout(()=>document.getElementById('wordInput').focus(),50);else document.getElementById('wordInput').value='';}));
document.getElementById('wordInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer();});
document.getElementById('btnTrain').onclick=()=>startMode('train');document.getElementById('btnChallenge').onclick=()=>startMode('challenge');document.getElementById('btnTest').onclick=()=>startMode('test');document.getElementById('btnMenu').onclick=goMenu;document.getElementById('btnMenu2').onclick=goMenu;document.getElementById('btnAgain').onclick=()=>startMode(currentMode);document.getElementById('checkBtn').onclick=checkAnswer;document.getElementById('nextBtn').onclick=nextQuestion;
function checkAnswer(){if(answered)return;let q=deck[index], chosen=document.querySelector('input[name=type]:checked')?.value, input=norm(document.getElementById('wordInput').value);let ok=(chosen===q.type)&&(q.type==='OK'||input===norm(q.word));let fb=document.getElementById('feedback'), inp=document.getElementById('wordInput');answered=true;document.getElementById('checkBtn').classList.add('hidden');inp.disabled=true;if(ok){correct++;if(currentMode==='challenge')streak++;fb.className='feedback ok';fb.textContent='✓ SPRÁVNĚ';inp.classList.add('fieldOk');document.getElementById('nextBtn').classList.add('hidden');playSuccess();updateLabels();autoTimer=setTimeout(function(){index++;renderQuestion();},1500);}else{if(currentMode==='challenge')streak=0;fb.className='feedback bad';fb.innerHTML='✕ CHYBA<br><span style="font-size:55%">'+explain(q)+'</span>';inp.value=q.type==='OK'?'':q.word;inp.classList.add('fieldBad');document.getElementById('nextBtn').classList.remove('hidden');playError();updateLabels();}}
function explain(q){if(q.type==='OK')return 'SPRÁVNĚ: interpunkce je v pořádku';if(q.type==='ADD')return 'SPRÁVNĚ: čárka chybí za slovem „'+q.word+'“';return 'SPRÁVNĚ: čárku ubrat za slovem „'+q.word+'“';}
function nextQuestion(){index++;renderQuestion();}
function finishChallenge(){show('result');playWin();document.getElementById('resultTitle').textContent='MÁŠ JEDNIČKU!';document.getElementById('resultMain').textContent='1';document.getElementById('resultText').textContent='Zvládl/a jsi 16 správných odpovědí v řadě.';}
function finishTest(){let pct=correct/deck.length;let grade=pct>=.88?1:pct>=.74?2:pct>=.58?3:pct>=.42?4:5;show('result');grade===1?playWin():playTone(260,.15,'sawtooth');document.getElementById('resultTitle').textContent='VÝSLEDEK TESTU';document.getElementById('resultMain').textContent=grade;document.getElementById('resultText').textContent=`Správně: ${correct} z ${deck.length}.`;}
let audioCtx;function ctx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(freq=440,dur=.12,type='sine',delay=0){try{let c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.001,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(.16,c.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+dur);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+dur+.02);}catch(e){}}
function playSuccess(){playTone(523,.08,'triangle');playTone(784,.11,'triangle',.08);} function playError(){playTone(155,.16,'sawtooth');playTone(110,.20,'sawtooth',.11);} function playWin(){[523,659,784,1046].forEach((f,i)=>playTone(f,.14,'triangle',i*.1));}
</script></body></html>
